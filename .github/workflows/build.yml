name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps (esbuild + react)
        run: npm install --silent esbuild react react-dom

      - name: Build CSS via Tailwind standalone binary
        # Uses the prebuilt Linux binary from Tailwind's GitHub releases.
        # Zero npm/npx involvement — most reliable approach in CI.
        run: |
          echo "::group::Setup"
          mkdir -p dist
          curl -fsSL -o ./tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          chmod +x ./tailwindcss
          ./tailwindcss --help | head -3
          echo "::endgroup::"

          echo "::group::Compile"
          ./tailwindcss \
            -c tailwind.config.js \
            -i src/styles.css \
            -o dist/styles.css \
            --minify
          echo "::endgroup::"

          echo "--- dist/styles.css size ---"
          wc -c dist/styles.css

      - name: Build app JS
        env:
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
          CORS_PROXY_URL:   ${{ secrets.CORS_PROXY_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: node build.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
