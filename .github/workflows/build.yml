name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          npm install --silent esbuild react react-dom
          npm install --silent tailwindcss@^3.4.0 @tailwindcss/cli@^3 || npm install --silent tailwindcss@^3.4.0
          ls node_modules/.bin/ | grep -i tailwind || true

      - name: Build CSS (precompile Tailwind — only utilities actually used)
        run: |
          mkdir -p dist
          # Call the binary directly — bypass npx, which fails inconsistently in CI
          node ./node_modules/tailwindcss/lib/cli.js \
            -c tailwind.config.js \
            -i src/styles.css \
            -o dist/styles.css \
            --minify
          echo "--- dist/styles.css info ---"
          wc -c dist/styles.css

      - name: Build app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          node build.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
